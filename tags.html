---
layout: default
title: 标签
permalink: /tags/
---

<style>
  /* 标签卡片容器 */
  .tag-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    max-width: 1000px;
    margin: 50px auto;
    justify-content: center;
  }
  /* 单个标签卡片 */
  .tag-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 30px 20px;
    min-width: 150px;
    text-decoration: none;
    color: #333;
    transition: all 0.2s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .tag-card:hover {
    border-color: #1a73e8;
    box-shadow: 0 4px 12px rgba(26,115,232,0.2);
    transform: translateY(-3px);
  }
  .tag-card .name {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .tag-card .count {
    font-size: 12px;
    color: #888;
    background: #f3f4f6;
    padding: 2px 10px;
    border-radius: 20px;
  }
</style>

<h2 style="text-align:center; margin-top:40px;">标签分类</h2>

<div class="tag-grid">
  {% for tag in site.tags %}
    {% assign tag_name = tag[0] %}
    {% assign posts = tag[1] %}
    <a href="{{ '/tags/' | relative_url }}{{ tag_name | url_encode }}/" class="tag-card">
      <span class="name">{{ tag_name }}</span>
      <span class="count">{{ posts.size }} 篇</span>
    </a>
  {% endfor %}
</div>
