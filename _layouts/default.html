<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-top">
      <div class="site-avatar">
        <!-- 占位头像文件（assets/images/avatar.svg） -->
        <img src="/assets/images/avatar.svg" alt="{{ site.title | default: 'clubsk' }}" class="avatar-img" />
      </div>
      <div class="site-title">
        <h1><a href="/">{{ site.title | default: "clubsk" }}</a></h1>
        <p class="tagline">{{ site.tagline | default: "My blog" }}</p>
        <nav class="site-nav" aria-label="主导航">
          <a href="/">首页</a>
          <a href="/posts/">博客</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>© {{ site.title | default: "clubsk" }} · GitHub Pages</p>
    </div>
  </footer>
</body>
</html>
