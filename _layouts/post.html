---
layout: default
---
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ page.title }} · {{ site.title | default: "clubsk" }}</title>
  <meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | default: site.description }}" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/styles.css">
  <style>
  /* Post layout + TOC styles (kept local to post layout for now) */
  .post {
    max-width: 1200px;
    margin: 28px auto;
    padding: 0 16px;
    display: flex;
    gap: 40px;
    align-items: flex-start;
  }
  .post-content { flex: 1; min-width: 0; }
  .post-header { margin-bottom: 18px; }
  .post-title { font-size: 2rem; margin: 0 0 6px 0; color: var(--accent-solid); }
  .post-meta { color: var(--muted); font-size: 0.95rem; }

  /* TOC (right column) */
  .post-toc {
    flex: 0 0 260px;
    position: sticky;
    top: 30px;
    max-height: calc(100vh - 60px);
    overflow-y: auto;
    padding: 18px;
    background: rgba(255,255,255,0.6);
    border-radius: 12px;
    border: 1px solid rgba(16,24,40,0.04);
  }
  .toc-title { font-weight: bold; margin-bottom: 12px; font-size: 0.95rem; }
  .toc-list { list-style: none; padding-left: 0; margin: 0; font-size: 0.95rem; }
  .toc-list li { margin-bottom: 8px; }
  .toc-list li a { color: var(--muted); text-decoration: none; }
  .toc-list li a:hover { color: var(--accent-solid); }
  .toc-h2 { margin-left: 0; font-weight: 600; }
  .toc-h3 { margin-left: 8px; font-weight: 500; }
  .toc-h4 { margin-left: 16px; font-weight: 400; }

  /* 返回按钮样式 */
  .post-footer {
    margin-top: 60px;
    padding-top: 24px;
    border-top: 1px solid rgba(16,24,40,0.08);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  .post-nav {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .post-nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border: 1px solid rgba(16,24,40,0.12);
    border-radius: 8px;
    background: #ffffff;
    color: var(--text);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    transition: all 0.2s ease;
  }

  .post-nav-btn:hover {
    background: var(--accent-solid);
    color: #ffffff;
    border-color: var(--accent-solid);
    transform: translateY(-2px);
  }

  .post-nav-icon {
    display: inline-block;
    font-size: 1.2em;
  }

  /* 小屏目录按钮样式 */
  .toc-toggle-btn {
    position: fixed;
    bottom: 30px;
    right: 20px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--accent-solid);
    color: white;
    border: none;
    cursor: pointer;
    font-size: 24px;
    box-shadow: 0 4px 12px rgba(16,24,40,0.2);
    transition: all 0.3s ease;
    z-index: 999;
    align-items: center;
    justify-content: center;
    display: none;
  }

  .toc-toggle-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 16px rgba(16,24,40,0.3);
  }

  .toc-toggle-btn:active {
    transform: scale(0.95);
  }

  /* 侧边栏目录容器 */
  .toc-sidebar {
    display: none;
    position: fixed;
    top: 0;
    right: 0;
    width: 280px;
    height: 100vh;
    background: #ffffff;
    box-shadow: -4px 0 12px rgba(16,24,40,0.1);
    z-index: 1000;
    overflow-y: auto;
    padding: 20px;
    animation: slideIn 0.3s ease;
  }

  .toc-sidebar.active {
    display: block;
  }

  @keyframes slideIn {
    from {
      transform: translateX(100%);
    }
    to {
      transform: translateX(0);
    }
  }

  .toc-close-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 32px;
    height: 32px;
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 24px;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease;
  }

  .toc-close-btn:hover {
    transform: rotate(90deg);
  }

  .toc-sidebar .toc-title {
    margin-top: 30px;
    font-size: 0.95rem;
  }

  .toc-sidebar .toc-list {
    font-size: 0.9rem;
  }

  .toc-sidebar .toc-list li a {
    color: var(--text);
    padding: 6px 0;
    display: block;
  }

  .toc-sidebar .toc-list li a:hover {
    color: var(--accent-solid);
  }

  /* 遮罩层 */
  .toc-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.3);
    z-index: 999;
  }

  .toc-overlay.active {
    display: block;
  }

  /* 文章内容图片样式 */
  .post-body img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 16px 0;
    border-radius: 8px;
  }

  .post-body img[alt] {
    outline: 1px solid rgba(16, 24, 40, 0.08);
    padding: 4px;
  }

  @media (max-width: 920px) {
    .post { display: block; }
    .post-toc { display: none; }
    .toc-toggle-btn { display: flex; }
  }

  @media (max-width: 720px) {
    .post-footer {
      justify-content: center;
      margin-top: 40px;
      padding-top: 16px;
    }
    
    .post-nav {
      width: 100%;
      justify-content: center;
    }
    
    .post-nav-btn {
      flex: 1;
      min-width: 140px;
      justify-content: center;
    }

    .toc-sidebar {
      width: 260px;
    }

    .toc-toggle-btn {
      bottom: 20px;
      right: 16px;
    }

    .post-body img {
      margin: 12px 0;
    }
  }
  </style>
</head>
<body>
  <!-- 遮罩层 -->
  <div class="toc-overlay" id="toc-overlay"></div>

  <!-- 侧边栏目录 -->
  <aside class="toc-sidebar" id="toc-sidebar" aria-label="文章目录">
    <button class="toc-close-btn" id="toc-close-btn" title="关闭目录">×</button>
    <div class="toc-title">目录</div>
    <div id="markdown-toc">
      <!-- JS will build the TOC here from headings in .post-body -->
    </div>
  </aside>

  <!-- 目录开关按钮 -->
  <button class="toc-toggle-btn" id="toc-toggle-btn" title="打开目录">📋</button>

  <main id="main" class="content post" role="main">
    <article class="post-article">
      <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>

        <div class="post-meta">
          {{ page.date | date: "%Y-%m-%d" }}

          {% if page.tags %}
            · 标签：
            {% for t in page.tags %}
              <a href="{{ '/tags/' | relative_url }}{{ t | slugify }}/" class="tag">{{ t }}</a>
            {% endfor %}
          {% endif %}
        </div>
      </header>

      <div class="post-content post-body">
        {{ content }}
      </div>

      <!-- 返回按钮区域 -->
      <footer class="post-footer">
        <div class="post-nav">
          <a href="javascript:history.back()" class="post-nav-btn" title="返回上一页">
            <span class="post-nav-icon">←</span>
            上一页
          </a>
          <a href="/" class="post-nav-btn" title="返回首页">
            首页
            <span class="post-nav-icon">→</span>
          </a>
        </div>
      </footer>

    </article>

    {% if page.toc %}
    <aside class="post-toc" aria-label="文章目录">
      <div class="toc-title">目录</div>
      <div id="markdown-toc-desktop">
        <!-- JS will build the TOC here from headings in .post-body -->
      </div>
    </aside>
    {% endif %}

  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    // Build TOC from headings
    try {
      var body = document.querySelector('.post-body');
      if (!body) return;

      var headings = body.querySelectorAll('h2, h3, h4');
      if (!headings || headings.length === 0) {
        document.getElementById('markdown-toc').innerHTML = '<p class="muted">本文暂无目录</p>';
        return;
      }

      var ul = document.createElement('ul');
      ul.className = 'toc-list';

      headings.forEach(function (h) {
        if (!h.id) {
          var base = h.textContent.trim().toLowerCase().replace(/[^\w\-\u4e00-\u9fa5\s]/g, '').replace(/\s+/g, '-');
          var id = base || 'heading';
          var uniq = id;
          var i = 1;
          while (document.getElementById(uniq)) { uniq = id + '-' + i; i++; }
          h.id = uniq;
        }

        var li = document.createElement('li');
        li.className = 'toc-' + h.tagName.toLowerCase();
        var a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        a.addEventListener('click', function (e) {
          e.preventDefault();
          var target = document.getElementById(h.id);
          if (!target) return;
          var offset = 20;
          var top = target.getBoundingClientRect().top + window.pageYOffset - offset;
          window.scrollTo({ top: top, behavior: 'smooth' });
          history.replaceState ? history.replaceState(null, null, '#' + h.id) : (location.hash = '#' + h.id);
        });
        li.appendChild(a);
        ul.appendChild(li);
      });

      document.getElementById('markdown-toc').appendChild(ul);
    } catch (err) {
      console.warn('TOC build failed', err);
    }

    // 小屏目录开关逻辑
    var tocToggleBtn = document.getElementById('toc-toggle-btn');
    var tocSidebar = document.getElementById('toc-sidebar');
    var tocOverlay = document.getElementById('toc-overlay');
    var tocCloseBtn = document.getElementById('toc-close-btn');

    function openToc() {
      tocSidebar.classList.add('active');
      tocOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeToc() {
      tocSidebar.classList.remove('active');
      tocOverlay.classList.remove('active');
      document.body.style.overflow = '';
    }

    tocToggleBtn.addEventListener('click', openToc);
    tocCloseBtn.addEventListener('click', closeToc);
    tocOverlay.addEventListener('click', closeToc);

    // 点击目录链接后自动关闭
    document.getElementById('markdown-toc').addEventListener('click', function (e) {
      if (e.target.tagName === 'A') {
        setTimeout(closeToc, 300);
      }
    });
  });
  </script>
</body>
</html>
