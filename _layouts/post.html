---
layout: default
---
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ page.title }} · {{ site.title | default: "clubsk" }}</title>
  <meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | default: site.description }}" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* 文章页加强样式 */
    .post { max-width: 880px; margin: 28px auto; padding: 0 16px; }
    .post-header{margin-bottom:18px}
    .post-title{font-size:2rem;margin:0 0 6px 0;color:var(--accent-solid)}
    .post-meta{color:var(--muted);font-size:0.95rem}
    .post-body img{max-width:100%;height:auto;display:block;margin:12px 0}

    /* 代码块：提高对比度、间距和可读性 */
    .post-body pre,
    .post-body .highlight pre {
      position: relative;
      margin: 1.5rem 0;
      padding: 1.2rem 1.35rem;
      overflow-x: auto;
      color: #e6edf3;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      box-shadow: 0 5px 18px rgba(15, 23, 42, 0.12);
      font: 0.92rem/1.7 ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", Consolas, monospace;
      tab-size: 2;
      -webkit-overflow-scrolling: touch;
    }
    .post-body pre code,
    .post-body .highlight pre code {
      display: block;
      padding: 0;
      color: inherit;
      background: transparent;
      border: 0;
      font: inherit;
      white-space: pre;
    }
    /* 行内代码与代码块使用不同样式，避免背景色混在一起 */
    .post-body :not(pre) > code {
      padding: 0.15em 0.4em;
      color: #b42318;
      background: #fff1f0;
      border: 1px solid #ffd6d2;
      border-radius: 5px;
      font: 0.9em ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", Consolas, monospace;
    }
    .post-body pre::-webkit-scrollbar { height: 9px; }
    .post-body pre::-webkit-scrollbar-track { background: #21262d; border-radius: 9px; }
    .post-body pre::-webkit-scrollbar-thumb { background: #484f58; border-radius: 9px; }
    .post-body pre::-webkit-scrollbar-thumb:hover { background: #6e7681; }
    @media (max-width:720px) {
      .post-body pre,
      .post-body .highlight pre { margin-left: -8px; margin-right: -8px; padding: 1rem; font-size: 0.84rem; border-radius: 8px; }
    }

    .back-link{display:inline-block;margin-top:18px;color:var(--accent-solid);text-decoration:none}
  </style>
</head>
<body>
  
  <main id="main" class="content post" role="main">
    <article class="post-article">
      <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        <div class="post-meta">{{ page.date | date: "%Y-%m-%d" }}{% if page.tags %} · 标签：{% for t in page.tags %}<span class="tag">{{ t }}</span>{% unless forloop.last %},{% endunless %}{% endfor %}{% endif %}</div>
      </header>

      <div class="post-body">
        {{ content }}
      </div>

      <p><a class="back-link" href="/">← 返回首页</a></p>
    </article>
  </main>

</body>
</html>
