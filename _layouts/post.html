---
layout: default
---
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ page.title }} · {{ site.title | default: "clubsk" }}</title>
  <meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | default: site.description }}" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/styles.css">
  <style>
      /* 文章页加强样式 */
  /* 1. 将主容器加宽，用于容纳正文和右侧目录 */
  .post { max-width: 1200px; margin: 28px auto; padding: 0 16px; display: flex; gap: 40px; align-items: flex-start; }
  .post-header{margin-bottom:18px}
  .post-title{font-size:2rem;margin:0 0 6px 0;color:var(--accent-solid)}
  .post-meta{color:var(--muted);font-size:0.95rem}
  
  /* 2. 左侧正文自适应宽度 */
  .post-content { flex: 1; min-width: 0; }
  .post-content img{max-width:100%;height:auto;display:block;margin:12px 0}

  /* 3. 右侧目录悬浮样式 */
  .post-toc { 
    flex: 0 0 250px; /* 固定宽度 */
    position: sticky; /* 核心：实现悬浮 */
    top: 30px; /* 距离浏览器顶部距离 */
    max-height: calc(100vh - 60px);
    overflow-y: auto; /* 目录太长时显示滚动条 */
    padding: 20px;
    background: rgba(255, 255, 255, 0.6); /* 稍微透点底，看主题背景色自行微调 */
    border-radius: 12px;
  }
  
  .post-toc .toc-title { font-weight: bold; margin-bottom: 12px; font-size: 0.9rem; }
  .post-toc ul { list-style: none; padding-left: 0; font-size: 0.9rem; }
  .post-toc li { margin-bottom: 6px; }
  .post-toc a { text-decoration: none; color: var(--muted); }
  .post-toc a:hover { color: var(--accent-solid); }

    /* 代码块：改成白底黑字，视觉更清爽 */
    .post-body pre,
    .post-body .highlight pre {
      position: relative;
      margin: 1.5rem 0;
      padding: 1.2rem 1.35rem;
      overflow-x: auto;
      color: #111827;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
      font: 0.92rem/1.7 ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", Consolas, monospace;
      tab-size: 2;
      -webkit-overflow-scrolling: touch;
    }
    .post-body pre code,
    .post-body .highlight pre code {
      display: block;
      padding: 0;
      color: inherit;
      background: transparent;
      border: 0;
      font: inherit;
      white-space: pre;
    }
    .post-body :not(pre) > code {
      padding: 0.15em 0.4em;
      color: #111827;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 5px;
      font: 0.9em ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", Consolas, monospace;
    }
    .post-body pre::-webkit-scrollbar { height: 9px; }
    .post-body pre::-webkit-scrollbar-track { background: #f3f4f6; border-radius: 9px; }
    .post-body pre::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 9px; }
    .post-body pre::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    @media (max-width:720px) {
      .post-body pre,
      .post-body .highlight pre { margin-left: -8px; margin-right: -8px; padding: 1rem; font-size: 0.84rem; border-radius: 8px; }
    }

    .back-link{display:inline-block;margin-top:18px;color:var(--accent-solid);text-decoration:none}
  </style>
</head>
<body>
  
  <main id="main" class="content post" role="main">
    <article class="post-article">
      <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>

        <div class="post-meta">
          {{ page.date | date: "%Y-%m-%d" }}

          {% if page.tags %}
            · 标签：
            {% for t in page.tags %}
              <a href="{{ '/tags/' | relative_url }}{{ t | slugify }}/" class="tag">
                {{ t }}
              </a>
            {% endfor %}
          {% endif %}
        </div>
      </header>

      <div class="post-body">
        {{ content }}

      
      </div>

    </article>
     <p><a class="back-link" href="{{ '/' | relative_url }}">← 返回首页</a></p>
  </main>

</body>
</html>
