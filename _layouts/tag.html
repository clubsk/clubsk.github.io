---
layout: default
---

<style>
  .tag-header {
    text-align: center;
    padding: 50px 20px 30px;
    border-bottom: 1px solid #e5e7eb;
    margin-bottom: 30px;
  }
  .tag-header h1 {
    font-size: 2rem;
    margin-bottom: 10px;
  }
  .tag-header p {
    color: #666;
  }

  .tag-post-list {
    list-style: none;
    padding: 0;
    max-width: 800px;
    margin: 0 auto;
  }
  .tag-post-list li {
    padding: 18px 0;
    border-bottom: 1px solid #f3f4f6;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .tag-post-list li:last-child {
    border-bottom: none;
  }
  .tag-post-link {
    font-size: 1.15rem;
    color: #333;
    text-decoration: none;
  }
  .tag-post-link:hover {
    color: #1a73e8;
  }
  .tag-post-date {
    font-size: 0.9rem;
    color: #999;
    font-family: monospace;
  }
</style>

{% assign tag_name = page.title %}

<div class="tag-header">
  <h1>#{{ tag_name }}</h1>
  <p>
    {% assign posts = site.posts | where_exp: "post", "post.tags contains tag_name" %}
    共 {{ posts | size }} 篇文章
  </p>
</div>

<ul class="tag-post-list">
  {% for post in posts %}
    <li>
      <a class="tag-post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <span class="tag-post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
    </li>
  {% endfor %}
</ul>
