---
layout: default
---

<div class="post-container">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
        <span>发布时间：{{ page.date | date: "%Y-%m-%d" }}</span>
        {% if page.categories %}
        <span class="post-category"> | 分类：{{ page.categories | join: ", " }}</span>
        {% endif %}
    </p>

    <hr>

    <div class="post-content">
        {{ content }}
    </div>
</div>
