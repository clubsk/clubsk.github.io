<style>
  .friends-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .friend-card { display: block; padding: 14px 16px; border: 1px solid #e5e7eb; border-radius: 10px; text-decoration: none; color: inherit; background: #fff; transition: box-shadow 0.2s, transform 0.2s; }
  .friend-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); transform: translateY(-2px); }
  .friend-name { font-weight: bold; margin-bottom: 4px; }
  .friend-desc { font-size: 0.85em; color: #666; }
</style>

<div class="friends-grid">
  {% for f in site.data.friends %}
  <a class="friend-card" href="{{ f.url }}" target="_blank" rel="noopener noreferrer">
    <div class="friend-name">{{ f.name }}</div>
    <div class="friend-desc">{{ f.desc }}</div>
  </a>
  {% endfor %}
</div>
