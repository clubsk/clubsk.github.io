---
layout: default
title: 博客
---

<!-- 博客列表容器 -->
<div class="card-grid">
  {% for post in site.posts %}
    <div class="card-item">
      <a href="{{ post.url }}" class="card-link">
        <h3 class="card-title">{{ post.title }}</h3>
        <div class="card-meta">
          <span class="card-date">{{ post.date | date: "%Y-%m-%d" }}</span>
        </div>
      </a>
    </div>
  {% endfor %}
</div>
